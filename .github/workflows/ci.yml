name: CI/CD - democyber

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- GITLEAKS ---
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- COMPILATION MAVEN ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Java project with Maven
        run: mvn clean package

      # --- DOCKER LOGIN, BUILD & TEST ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }} .

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 ${{ env.DOCKER_IMAGE_NAME }}
          sleep 10
          curl -f http://localhost:8080 || echo "App not responding"
          docker stop democyber-test
          docker rm democyber-test

      # --- TRIVY SCAN (Format Table) ---
      - name: Build Docker image for Trivy
        run: docker build -t democyber:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: 'democyber:latest'
          format: 'table'
          exit-code: '1' # C'est ce qui va faire échouer le pipeline
          severity: 'CRITICAL,HIGH'

      # --- TRIVY SCAN (Format SARIF) & UPLOAD ---
      - name: Scan Docker image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: 'democyber:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
        if: always()

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
        if: always()