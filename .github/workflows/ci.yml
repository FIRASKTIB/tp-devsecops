name: CI/CD - democyber

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # ==========================================
      # 1. RÉCUPÉRATION DU CODE
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. GITLEAKS (Sécurité des secrets)
      # ==========================================
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
        if: always()

      # ==========================================
      # 3. COMPILATION MAVEN
      # ==========================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Java project with Maven
        run: mvn clean package

      # ==========================================
      # 4. SONARCLOUD SCAN (Qualité du code)
      # ==========================================
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # ==========================================
      # 5. DOCKER LOGIN, BUILD & TEST
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }} .

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 ${{ env.DOCKER_IMAGE_NAME }}
          sleep 10
          curl -f http://localhost:8080 || echo "App not responding"
          docker stop democyber-test
          docker rm democyber-test

      # ==========================================
      # 6. TRIVY (Sécurité de l'image Docker)
      # ==========================================
      - name: Build Docker image for Trivy
        run: docker build -t democyber:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: 'democyber:latest'
          format: 'table'
          exit-code: '0' # Mis à 0 pour ne pas bloquer le pipeline
          severity: 'CRITICAL,HIGH'

      - name: Scan Docker image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: 'democyber:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
        if: always()

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
        if: always()

      # ==========================================
      # 7. PUSH DOCKER HUB
      # ==========================================
      - name: Push Docker image
        run: docker push ${{ env.DOCKER_IMAGE_NAME }}