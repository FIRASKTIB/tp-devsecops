name: CI/CD - democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # ==========================================
      # ÉTAPE 0 : Récupération du code
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRUCIAL pour Gitleaks (scanner tout l'historique)

      # ==========================================
      # ÉTAPE 1 : Compilation Java (Maven)
      # ==========================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Java project with Maven
        run: mvn clean package

      # ==========================================
      # PARTIE I : GITLEAKS
      # ==========================================
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2 # Action officielle mise à jour
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
        if: always() # Permet l'upload même si un secret est trouvé (échec)

      # ==========================================
      # PARTIE II : DOCKER & TRIVY
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }} .

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 ${{ env.DOCKER_IMAGE_NAME }}
          sleep 10
          curl -f http://localhost:8080 || echo "App not responding"
          docker stop democyber-test
          docker rm democyber-test

      - name: Build Docker image for Trivy
        run: docker build -t democyber:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.20.0 # Le "v" est obligatoire
        with:
          image-ref: 'democyber:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Étape ajoutée selon la consigne "Modifier le format et ajouter une étape pour télécharger le rapport"
      - name: Scan Docker image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: 'democyber:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0' # On met 0 pour ne pas bloquer ici, le blocage est fait à l'étape du dessus
        if: always()

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
        if: always()

      # ==========================================
      # PARTIE III : PUSH DOCKER HUB
      # ==========================================
      - name: Push Docker image
        run: docker push ${{ env.DOCKER_IMAGE_NAME }}