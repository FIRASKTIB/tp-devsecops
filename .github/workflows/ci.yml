name: CI/CD - democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # ==========================================
      # PARTIE 0 : Récupération du code
      # ==========================================
      - name: Checkout the code
        uses: actions/checkout@v4

      # ==========================================
      # PARTIE I : GITLEAKS (Sécurité du code)
      # ==========================================
      - name: Run Gitleaks scan
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
        # 'if: always()' permet d'uploader le rapport même si Gitleaks a échoué (trouvé un secret)
        if: always() 

      # ==========================================
      # PARTIE II : DOCKER BUILD, TEST & TRIVY
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }} .

      - name: Test Docker image locally
        run: |
          docker run -d --name democyber-test -p 8080:8080 ${{ env.DOCKER_IMAGE_NAME }}
          sleep 10
          curl -f http://localhost:8080 || echo "App not responding"
          docker stop democyber-test
          docker rm democyber-test

      # Trivy scan (comme demandé dans votre TP)
      - name: Build Docker image for Trivy
        run: docker build -t democyber:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: 'democyber:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # ==========================================
      # PARTIE III : PUSH SUR DOCKER HUB
      # ==========================================
      - name: Push Docker image
        run: docker push ${{ env.firasktib }}